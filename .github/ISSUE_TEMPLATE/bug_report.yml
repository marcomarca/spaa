name: Reporte de Bug
description: Crea un informe para ayudar a reproducir y solucionar un problema
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Comportamiento Observado
      description: ¿Qué ocurrió?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento Esperado
      description: ¿Qué debería haber ocurrido?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos de Reproducción
      description: Pasos exactos o comando ejecutado
    validations:
      required: true
