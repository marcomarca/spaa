<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SPAA Worker</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    h1 { font-size: 1rem; margin-top: 0; margin-bottom: 8px; color: #38bdf8; }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .info-row { margin-top: 12px; font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body>
  <h1>SPAA Gemini Worker</h1>
  <div><span class="badge" id="worker-status">Activo / Conectado</span></div>
  <div class="info-row">
    <strong>Perfil:</strong> Perfil A<br>
    <strong>Servidor:</strong> localhost:8000<br>
    <strong>Modelo:</strong> gemini-2.5-pro-preview-tts
  </div>
</body>
</html>
